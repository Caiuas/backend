services:

  flask_app:
    build: ./flask_app
    container_name: backend
    restart: always
    env_file:
      - .env 
    ports:
      - "5001:5000"
    volumes:
      - ./flask_app:/app
    command: "flask run --host=0.0.0.0 --port=5000"

  worker_integracao_des:
    build: ./workers/estoque_veiculos_des
    container_name: worker_integracao_des
    restart: always
    tty: True
    env_file:
      - .env 
    volumes:
      - ./workers/estoque_veiculos_des:/app
    command: "bash -c 'python3 estoque_veiculos.py & python3 agendamentos.py & wait'"
  
  worker_send_wpp_agendamento:
    build: ./workers/send_wpp_agendamento
    container_name: worker_send_wpp_agendamento
    restart: always
    # tty: true
    env_file:
      - .env 
    volumes:
      - ./workers/send_wpp_agendamento:/app
    command: "python3 app.py"

  worker_update_questionario:
