services:

  traefik:
    image: traefik:2.11.2
    command:
    - "--api.dashboard=true"
    - "--providers.docker=true"
    - "--providers.docker.exposedbydefault=false"
    - "--entrypoints.web.address=:80"
    - "--entrypoints.websecure.address=:443"
    - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge=true"
    - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge.entrypoint=web"
    - "--certificatesresolvers.letsencryptresolver.acme.email=opabloedu@gmail.com"
    - "--certificatesresolvers.letsencryptresolver.acme.storage=/letsencrypt/acme.json"
    - "--log.level=DEBUG"
    ports:
    - "80:80"
    - "443:443"
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./traefik/letsencrypt:/letsencrypt
    restart: always

  flask_app:
    build: ./flask_app
    container_name: app_flask
    restart: always
    env_file:
      - .env 
    volumes:
      - ./flask_app:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flask-app.rule=Host(`backend.caiuas.com.br`)"
      - "traefik.http.routers.flask-app.entrypoints=websecure"
      - "traefik.http.routers.flask-app.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.flask-app.loadbalancer.server.port=5000" # Porta padrão do Flask
    command: "flask run --host=0.0.0.0 --port=5000"
  
  streamlit_app:
    build: ./streamlit_app
    container_name: app_streamlit
    restart: always
    # manter ligado
    tty: true
    env_file:
      - .env 
    volumes:
      - ./streamlit_app:/app
    # libera rede para fora
    ports:
      - "8501:8501" # Porta padrão do Streamlit
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.streamlit-app.rule=Host(`bi.caiuas.com.br`)"
      - "traefik.http.routers.streamlit-app.entrypoints=web,websecure"
      - "traefik.http.routers.streamlit-app.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.streamlit-app.loadbalancer.server.port=8501" # Porta padrão do Streamlit
    command: "streamlit run app.py --server.port 8501 --server.address 0.0.0.0"

